<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>José Henrique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --ink:#16202B; --muted:#5B6776; --line:#D5DAE1;
  --accent:#1F4E79; --accent-ink:#FFFFFF; --ring:#1F4E79;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --surface:#18202A; --ink:#EEF1F5; --muted:#9AA6B5; --line:#2A3441;
    --accent:#7FB0E0; --accent-ink:#0E1620; --ring:#7FB0E0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --ink:#EEF1F5; --muted:#9AA6B5; --line:#2A3441;
  --accent:#7FB0E0; --accent-ink:#0E1620; --ring:#7FB0E0; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);
  display:flex;justify-content:center;align-items:flex-start;padding:56px 20px 40px}
main{width:100%;max-width:420px;text-align:center}
.photo{width:136px;height:136px;margin:0 auto 22px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.photo span{font-family:var(--serif);font-size:44px;color:var(--accent);letter-spacing:.02em}
h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.15;margin:0 0 8px;letter-spacing:-.01em}
.lead{margin:0 auto 34px;max-width:32ch;color:var(--muted);font-size:15px;line-height:1.55}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.link{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;text-decoration:none;
  color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;
  transition:border-color .15s,transform .15s}
.link:hover{border-color:var(--accent);transform:translateY(-1px)}
.link:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
.icon{flex:none;width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center}
.icon svg{width:22px;height:22px;fill:currentColor}
.txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.txt strong{font-size:16px;font-weight:600}
.txt small{font-size:13px;color:var(--muted)}
.credit{margin:36px 0 0;font-size:13px;color:var(--muted)}
.credit a{font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.credit a:hover{text-decoration-color:var(--accent)}
.credit a:focus-visible{outline:3px solid var(--ring);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){.link{transition:none}.link:hover{transform:none}}
</style>
</head>
